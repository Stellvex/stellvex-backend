version: '3.9'

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL database
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellvex
      POSTGRES_PASSWORD: stellvex_secret
      POSTGRES_DB: stellvex_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stellvex -d stellvex_db']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────
  # Stellvex backend API
  # ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://stellvex:stellvex_secret@db:5432/stellvex_db
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
